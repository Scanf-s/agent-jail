[package]
name = "agent-jail"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aj"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "mount", "process", "sched", "user", "signal"] }
num_cpus = "1.17.0"
oci-spec = { version = "0.10.0", default-features = false, features = ["runtime"] }
rand = "0.10.1"

[dev-dependencies]
serde_json = "1"
